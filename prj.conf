# Peripherals
CONFIG_GPIO=y
CONFIG_SPI=y

# SH1106 OLED plus the character framebuffer used to draw text on it.
# CFB allocates its frame buffer (128x64 mono = 1 KB) from the system heap.
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Console and logging over the DK's virtual COM port (115200 8N1)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

# The default 1 KB is tight for this main thread: snprintf, the CFB drawing
# calls and the SPI driver all nest on it. A stack overflow trips the MPU
# guard and halts the system, which looks exactly like a frozen display.
CONFIG_MAIN_STACK_SIZE=2048

# Catch mistakes early while developing; drop these for production builds
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y

# Uncomment to have stack headroom for every thread printed every 5 s,
# which tells you whether a freeze is a stack overflow or something else.
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
# CONFIG_THREAD_ANALYZER_USE_PRINTK=y